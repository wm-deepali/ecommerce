<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft background circle -->
  <circle cx="110" cy="110" r="100" fill="#f8f2e9"/>

  <!-- Dashed inner ring for a little polish -->
  <circle cx="110" cy="110" r="78" fill="none" stroke="#e9ddc8" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Cart body -->
  <g transform="translate(50, 70)">
    <!-- Cart basket -->
    <path d="M14 10 H26 L34 62 H98 L108 24 H36"
          fill="none" stroke="#b5904a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Basket front lines (subtle) -->
    <path d="M42 24 L46 62 M62 24 L64 62 M82 24 L80 62"
          stroke="#d8c39a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Wheels -->
    <circle cx="44" cy="76" r="7" fill="#4a4a4a"/>
    <circle cx="90" cy="76" r="7" fill="#4a4a4a"/>
    <circle cx="44" cy="76" r="2.5" fill="#f8f2e9"/>
    <circle cx="90" cy="76" r="2.5" fill="#f8f2e9"/>

    <!-- Cart handle -->
    <path d="M14 10 L6 10" stroke="#b5904a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Little "empty" sparkle accents -->
  <circle cx="60" cy="55" r="2.5" fill="#c98f9d"/>
  <circle cx="165" cy="70" r="2" fill="#b5904a"/>
  <circle cx="170" cy="150" r="2.5" fill="#c98f9d"/>
  <path d="M40 150 l4 4 -4 4 -4 -4 z" fill="#e9ddc8"/>

  <!-- Question mark style dashed "?" removed for cleanliness; keep minimal -->
</svg>
